name: Android Release Build

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      PROJECT_ID: umiren-d6a66
      STORAGE_BUCKET: umiren-d6a66.firebasestorage.app
      STORAGE_PATH: releases/app-release-${{ github.run_number }}.apk
      FIREBASE_VERSION_DOC: appUpdates/android

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Read app version info
        id: version
        run: |
          FULL_VER=$(grep '^version:' flutter_app/pubspec.yaml | sed 's/version: //' | tr -d ' ')
          APP_VERSION=$(echo "$FULL_VER" | cut -d'+' -f1)
          ANDROID_VERSION_CODE=$(echo "$FULL_VER" | cut -d'+' -f2)
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$ANDROID_VERSION_CODE" >> "$GITHUB_ENV"
          echo "Resolved Version: $APP_VERSION (Build $ANDROID_VERSION_CODE)"

      - name: Build Android release APK
        run: |
          cd flutter_app
          flutter build apk --release

      - name: Authenticate to Google Cloud
        id: gcloud_auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: steps.gcloud_auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload APK to Firebase Storage
        if: steps.gcloud_auth.outcome == 'success'
        run: |
          gcloud storage cp flutter_app/build/app/outputs/flutter-apk/app-release.apk \
            gs://$STORAGE_BUCKET/$STORAGE_PATH

      - name: Generate signed download URL
        if: steps.gcloud_auth.outcome == 'success'
        id: signed_url
        run: |
          URL=$(gcloud storage sign-url --duration=7d gs://$STORAGE_BUCKET/$STORAGE_PATH | tail -n 1)
          echo "APK_URL=$URL" >> "$GITHUB_ENV"

      - name: Update Firestore latest version document
        if: steps.gcloud_auth.outcome == 'success'
        run: |
          npm install firebase-admin --no-save
          node <<'NODE'
          const admin = require('firebase-admin');
          const fs = require('fs');

          const projectId = process.env.PROJECT_ID;
          const docPath = process.env.FIREBASE_VERSION_DOC;
          const versionName = process.env.APP_VERSION;
          const versionCode = Number(process.env.ANDROID_VERSION_CODE);
          const apkUrl = process.env.APK_URL;
          const releaseNotes = 'Automated release from GitHub Actions (Flutter)';

          if (!projectId || !apkUrl) {
            throw new Error('Missing project or APK URL');
          }

          admin.initializeApp({
            credential: admin.credential.applicationDefault(),
            projectId,
          });

          const db = admin.firestore();
          const releaseDoc = {
            versionCode,
            versionName,
            apkUrl,
            releaseNotes,
            updatedAt: new Date().toISOString(),
          };

          db.doc(docPath).set(releaseDoc, { merge: true })
            .then(() => {
              console.log('Firestore release document updated:', docPath);
              console.log(JSON.stringify(releaseDoc, null, 2));
            })
            .catch((error) => {
              console.error('Failed to update Firestore:', error);
              process.exit(1);
            });
          NODE
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
          ANDROID_VERSION_CODE: ${{ env.ANDROID_VERSION_CODE }}
          APK_URL: ${{ env.APK_URL }}
          PROJECT_ID: ${{ env.PROJECT_ID }}
          FIREBASE_VERSION_DOC: ${{ env.FIREBASE_VERSION_DOC }}

      - name: Upload artifact summary
        uses: actions/upload-artifact@v4
        with:
          name: umi-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
