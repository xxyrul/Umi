name: Scheduled Release Notification (9 AM & 12 PM)

on:
  schedule:
    # 9:00 AM Malaysia Time (MYT = UTC+8) -> 01:00 UTC
    - cron: '0 1 * * *'
    # 12:00 PM Malaysia Time (MYT = UTC+8) -> 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Broadcast Push Notification
        run: node scripts/notify-release.mjs --force
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
